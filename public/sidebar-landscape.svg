<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax slice">
  <!-- Ciel nocturne -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B38"/>
      <stop offset="1" stop-color="#07152F"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132A4E"/>
      <stop offset="1" stop-color="#0E2242"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1E3C"/>
      <stop offset="1" stop-color="#081831"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#sky)"/>
  <!-- Étoiles -->
  <g fill="#DCE6F5" opacity="0.7">
    <circle cx="30" cy="30" r="1"/><circle cx="75" cy="18" r="0.8"/><circle cx="120" cy="42" r="1.1"/>
    <circle cx="170" cy="22" r="0.7"/><circle cx="215" cy="52" r="1"/><circle cx="265" cy="28" r="0.9"/>
    <circle cx="310" cy="48" r="1.1"/><circle cx="355" cy="20" r="0.8"/><circle cx="48" cy="68" r="0.9"/>
    <circle cx="140" cy="80" r="0.7"/><circle cx="240" cy="90" r="1"/><circle cx="330" cy="75" r="0.8"/>
  </g>
  <!-- Lune -->
  <circle cx="340" cy="60" r="16" fill="#E8EDF5" opacity="0.9"/>
  <circle cx="334" cy="55" r="14" fill="#0B1B38" opacity="0.55"/>
  <!-- Chaîne de montagnes lointaine -->
  <path d="M0 150 L60 100 L105 132 L160 92 L215 128 L270 98 L330 130 L400 105 L400 220 L0 220 Z" fill="url(#ridge1)"/>
  <!-- Sommets enneigés -->
  <path d="M160 92 L172 104 L166 106 L160 100 L154 106 L148 104 Z" fill="#D9E4F2" opacity="0.5"/>
  <path d="M270 98 L281 109 L275 111 L270 105 L265 111 L259 109 Z" fill="#D9E4F2" opacity="0.45"/>
  <!-- Crête proche -->
  <path d="M0 185 L80 140 L150 172 L230 138 L300 170 L400 142 L400 220 L0 220 Z" fill="url(#ridge2)"/>
</svg>
