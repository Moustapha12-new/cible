# Configuration CLI locale. Les paramètres Auth hébergés se règlent dans le Dashboard.
project_id = "ucgetwemaxigkblzvndo"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[storage]
enabled = true
port = 54323
file_size_limit = "10MiB"

[auth]
enabled = true
port = 54324
site_url = "https://cible-mu.vercel.app"
additional_redirect_urls = ["https://cible-mu.vercel.app/connexion", "https://cible-mu.vercel.app/api/auth/confirm"]
enable_signup = true
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
